# Gemma 4 31B-it at eight bits: the trunk's linears and its lm_head int8 on Q8_0's grid (symmetric,
# an f16 scale a block of 128 columns, absmax / 127), int8 activations, z-lab's DFlash drafter
# merged in at int8 too (15 tokens a pass), and the vision tower. Converted with
# data/recipes/gemma4-31b-dense-bf16-q8-df.recipe. Sampling defaults are the checkpoint's
# generation_config; thinking is switched per request (chat_template_kwargs).
# 33 GiB of weights: ~16.5 GiB per card at --tp 2, ~8 GiB at --tp 4 on four cards.
name: radiance-gemma4-31b-q8-df
services:
  radiance:
    extends: { file: common.yaml, service: radiance }
    container_name: radiance-gemma4-31b-q8-df
    command: >
      --model /models/gemma4-31b-dense-q8-df.rad
      --host :: --port ${PORT:-8000} --api-key-env RADIANCE_API_KEY
      --tp 2 --max-num-seqs 8 --max-model-len 65536 --kv-cache-dtype fp8
      --num-speculative-tokens auto --max-num-batched-tokens 2048 --temp 1.0 --top-p 0.95 --top-k 64
