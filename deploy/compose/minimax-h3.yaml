# MiniMax-H3 (MiniMaxAI/MiniMax-H3) as block fp8: video with its stereo soundtrack from text, on
# OpenAI's /v1/videos, 1344x768 and 5.17 s by default, about 9 minutes a clip at its 50 steps.
# The text encoder and the modulation projections are read from pinned host memory
# (--vision-tower-placement ram), about 39 GiB of it. MiniMax-H3's license excludes use in the EU,
# the UK, the Republic of Korea and the USA.
# LoRA files (Civitai and the like, docs/GUIDE.md §4.9.2): put them under
# $RADIANCE_MODELS/loras/h3 and add `--lora-dir /models/loras/h3` to the command;
# a request names them in `loras` or as <lora:name:0.8> in its prompt.
name: radiance-minimax-h3
services:
  radiance:
    extends: { file: common.yaml, service: radiance }
    container_name: radiance-minimax-h3
    command: >
      --model /models/minimax-h3-fp8.rad
      --host :: --port ${PORT:-8000} --api-key-env RADIANCE_API_KEY
      --tp 2 --vision-tower-placement ram
