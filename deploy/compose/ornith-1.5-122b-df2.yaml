# Ornith-1.5-122B FP8 with incoai's DFlash2 drafter in place of the MTP head, on four cards with the
# host pool and the vision tower of ornith-1.5-122b.yaml. The drafter proposes 15 tokens in one pass,
# the depth radiance reads from the container. On four R9700s: 183 tok/s combined (BetterBench)
# against 165 with MTP, 342 against 194 on JSON, but 81 against 120 on prose; for chat, prose and
# many users take the MTP file. At 8 sequences the cache holds 690,992 tokens. Sampling as
# ornith-1.5-35b-a3b.yaml.
name: radiance-ornith-1.5-122b-df2
services:
  radiance:
    extends: { file: common.yaml, service: radiance }
    container_name: radiance-ornith-1.5-122b-df2
    command: >
      --model /models/ornith-1.5-122b-fp8-dflash2.rad
      --host :: --port ${PORT:-8000} --api-key-env RADIANCE_API_KEY
      --tp 4 --max-num-seqs 8 --max-model-len 262144 --kv-cache-dtype fp8
      --placement expert_tiered --host-pool-mib 3072 --vision-tower-placement ram
      --max-num-batched-tokens 2048
      --temp 1.0 --top-p 0.95 --top-k 20 --presence-penalty 1.5
