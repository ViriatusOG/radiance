# Gemma 4 31B-it on two cards with a block-16 DFlash2 drafter: the int4 trunk of
# gemma4-31b-w4a8-df2-tp4.yaml (round-to-nearest with a scale search, from the bf16 checkpoint; q, k
# and v as one linear) with int8 activations and lm_head, and the vision tower, with RedHatAI's DFlash2
# speculator fine-tuned from block 8 to block 16
# (https://huggingface.co/Ashlyn4202025/gemma-4-31B-it-speculator.dflash2-b16: 15 drafts a pass, int8
# head). Converted with data/recipes/gemma4-31b-dense-bf16-w4a8-df2.recipe and that drafter, or
# downloaded from https://huggingface.co/Ashlyn4202025/gemma4-31b-w4a8-dflash2-b16. Sampling defaults
# are the checkpoint's generation_config; thinking is switched per request (chat_template_kwargs).
#
# The drafter's proposals are verified as a 15-node tree a step (`auto`). From two users on, each
# tree is a 7-node one over the drafter's short block of 8 rows, so a busy server verifies and
# drafts the block-8 tree's shape, from the block-16 drafter. It turns itself on for this container
# (--draft-short-from auto; --draft-short-from 0 keeps the whole tree under load, for an A/B).
#
# --tp 2 over two cards. The token embedding stays in pinned host memory (the default), which leaves
# its VRAM to the KV cache. 16 sequences, as measured below. --gpu-headroom-mib 160 keeps room for
# the page tables the cards hold for pinned host memory, which the VRAM budget does not yet charge:
# without it a two-card start settles ~55 MiB short, and the prefill overlap's second lane can fail
# mid-serve.
#
# On 2x R9700 (PCIe 4.0 x16), BetterBench with thinking off, the box's other two cards serving a
# second server at the same time, the mean of two runs with the card pairs swapped: 253 tok/s
# single-stream (weighted over its categories; JSON 450, math 360, code 280, prose 131) and
# 217 / 328 / 518 / 559 / 776 tok/s aggregate at 1 / 2 / 4 / 8 / 16 users. The block-8 container,
# measured the same way: 199, and 180 / 323 / 494 / 530 / 682.
#
# Measured with the host CPU's performance governor and its idle states past C1 off. The cards'
# peer-to-peer traffic crosses the root complex, so the host's power state shows in every step, and
# a compose file can't set it.
name: radiance-gemma4-31b-w4a8-df2b16-tp2
services:
  radiance:
    extends: { file: common.yaml, service: radiance }
    container_name: radiance-gemma4-31b-w4a8-df2b16-tp2
    command: >
      --model /models/gemma4-31b-dense-w4a8-df2b16-qkv.rad
      --host :: --port ${PORT:-8000} --api-key-env RADIANCE_API_KEY
      --tp 2 --max-num-seqs 16 --max-model-len 65536 --kv-cache-dtype fp8
      --num-speculative-tokens auto --max-num-batched-tokens 8192
      --busy-prefill-chunk 512 --prefill-interleave 1 --gpu-headroom-mib 160
      --temp 1.0 --top-p 0.95 --top-k 64
