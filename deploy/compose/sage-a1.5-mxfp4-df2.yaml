# Sage-A1.5 with incoai's Qwen3.6-35B-A3B DFlash2 drafter in place of the MTP head, made by
# data/recipes/sage-a1.5-mxfp4-df2.recipe. The trunk linears, the routed and shared experts and the
# drafter's linears are OCP-MXFP4 (fp4_e2m1, one e8m0 scale per 32 of K); output.weight stays block
# FP8 and the draft head stays the 2-bit copy. The container is 19.52 GiB against 34.45 GiB for the
# block-FP8 sibling, and at tp2 it leaves ~8 GiB a card more VRAM for the cache (25.8 GiB against
# 33.8 GiB of weights+state a card).
#
# The profile below is the measured one on the deployment box: ten 262,144-token sessions, the whole
# expert plane in VRAM. Sampling is the model card's (temp 1.0, top_p 0.95, top_k 20, presence 1.5).
name: radiance-sage-a1.5-mxfp4-df2
services:
  radiance:
    extends: { file: common.yaml, service: radiance }
    container_name: radiance-sage-a1.5-mxfp4-df2
    command: >
      --model /models/sage-a1.5-mxfp4-df2.rad
      --host :: --port ${PORT:-8000} --api-key-env RADIANCE_API_KEY
      --tp 2 --max-num-seqs 10 --max-model-len 262144 --kv-cache-dtype fp8
      --gpu-headroom-mib 96
      --num-speculative-tokens auto --max-num-batched-tokens 2048
      --temp 1.0 --top-p 0.95 --top-k 20 --presence-penalty 1.5
