# FLUX.3 [klein] (black-forest-labs/flux-3-image-klein) as block fp8: text to image and edits from up
# to ten reference pictures on OpenAI's /v1/images/generations and /v1/images/edits, on one card,
# RADIANCE_GPU in .env (default 0). For the base model, point --model at flux-3-klein-base-fp8.rad.
# The FLUX Kommunity License (non-commercial use) applies.
# LoRA files (Civitai and the like, docs/GUIDE.md §4.9.2): put them under
# $RADIANCE_MODELS/loras/flux3 and add `--lora-dir /models/loras/flux3` to the command;
# a request names them in `loras` or as <lora:name:0.8> in its prompt.
name: radiance-flux-3-klein
services:
  radiance:
    extends: { file: common.yaml, service: radiance }
    container_name: radiance-flux-3-klein
    environment:
      ROCR_VISIBLE_DEVICES: "${RADIANCE_GPU:-0}"
    command: >
      --model /models/flux-3-klein-fp8.rad
      --host :: --port ${PORT:-8000} --api-key-env RADIANCE_API_KEY
      --tp 1
