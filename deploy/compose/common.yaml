# The service every model file in this directory extends: what any radiance container needs on an
# AMD host. A model file adds only its container and its flags.
#
# Each model takes both cards (--tp 2; a -tp1 file one) and the same port, so run one at a time:
#   docker compose -f flashnext.yaml up -d        start (it comes back after a reboot)
#   docker compose -f flashnext.yaml logs -f      follow the log
#   docker compose -f flashnext.yaml down         stop
#
# Settings come from .env beside this file (see .env.example).
services:
  radiance:
    image: ${RADIANCE_IMAGE:-stilldeadcode/radiance:latest}
    restart: unless-stopped
    init: true
    # Host networking: the server binds the host's own addresses, IPv4 and IPv6, with no NAT
    # between it and a reverse proxy.
    network_mode: host
    # Run as the host user so files the server writes belong to that user, not root.
    user: "${RADIANCE_UID:-1000}:${RADIANCE_GID:-1000}"
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "${RENDER_GID:?set RENDER_GID in .env}"
      - "${VIDEO_GID:?set VIDEO_GID in .env}"
    # The API key reaches the server through the container's environment, read by
    # --api-key-env, not its command line: argv is world-readable in `ps` and /proc, the
    # environment only by the process itself and root. The :? still fails closed on an unset
    # value, at compose-parse time, before any container starts.
    environment:
      RADIANCE_API_KEY: ${RADIANCE_API_KEY:?set RADIANCE_API_KEY in .env}
    # Docker's default seccomp profile refuses io_uring (used for the n-gram table's reads from the
    # model file) and the NUMA binding calls (mbind, set_mempolicy) the ROCm runtime makes for
    # host memory. seccomp-radiance.json beside this file is Docker's default plus exactly those
    # calls; point RADIANCE_SECCOMP at it (absolute host path) to run confined, and audit your
    # own card stack before you do -- unset, the service runs unconfined, as it always has.
    security_opt:
      - seccomp=${RADIANCE_SECCOMP:-unconfined}
    ulimits:
      memlock: -1
    volumes:
      - ${RADIANCE_MODELS:?set RADIANCE_MODELS in .env}:/models:ro
      - ${RADIANCE_CHAT_TEMPLATES:-../chat-templates}:/chat-templates:ro
    # A server finishes the step in flight and releases the cards on SIGTERM.
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:${PORT:-8000}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15m
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "5"
