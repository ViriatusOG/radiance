# TranslateGemma 27B, MXFP4 by GPTQ (data/recipes/translategemma-27b-mxfp4-gptq.recipe; the -df2
# recipe adds a DFlash2 drafter, whose depth the server takes from the container).
#
# The checkpoint's chat template takes structured turns naming the source and target languages and
# refuses the plain turn the server renders at startup (a user turn must read
# <<<source>>>en<<<target>>>cs<<<text>>>...), so a plain Gemma 3 template (gemma3.jinja, beside this
# file) stands in, and a client sends on /v1/completions the prompt the checkpoint's template renders
# ("You are a professional English (en) to Czech (cs) translator. ..."; its README shows it whole).
name: radiance-translategemma-27b
services:
  radiance:
    extends: { file: common.yaml, service: radiance }
    container_name: radiance-translategemma-27b
    volumes:
      - ./gemma3.jinja:/templates/gemma3.jinja:ro
    command: >
      --model /models/translategemma-27b-mxfp4-gptq.rad
      --host :: --port ${PORT:-8000} --api-key-env RADIANCE_API_KEY
      --tp 2 --max-num-seqs 8 --max-model-len 16384 --kv-cache-dtype fp8
      --override-chat-template /templates/gemma3.jinja
