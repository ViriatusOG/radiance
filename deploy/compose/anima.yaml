# Anima Aesthetic (circlestone-labs/Anima) as block fp8: text to image on OpenAI's
# /v1/images/generations, on one card, RADIANCE_GPU in .env (default 0). The Base and Turbo
# containers serve the same way (anima-base-fp8.rad, anima-turbo-fp8.rad).
# The CircleStone Labs Non-Commercial License and NVIDIA's Open Model License apply to the model;
# the pictures may be used commercially.
# LoRA files (Civitai and the like, docs/GUIDE.md §4.9.2): put them under
# $RADIANCE_MODELS/loras/anima and add `--lora-dir /models/loras/anima` to the command;
# a request names them in `loras` or as <lora:name:0.8> in its prompt.
name: radiance-anima
services:
  radiance:
    extends: { file: common.yaml, service: radiance }
    container_name: radiance-anima
    environment:
      ROCR_VISIBLE_DEVICES: "${RADIANCE_GPU:-0}"
    command: >
      --model /models/anima-aesthetic-fp8.rad
      --host :: --port ${PORT:-8000} --api-key-env RADIANCE_API_KEY
      --tp 1
