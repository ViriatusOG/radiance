# NVIDIA-Nemotron-3.5-Bolt-E4B (Gemma 4 E4B, post-trained by NVIDIA) at int8 on two cards: every trunk
# linear int8 at i8a8 (activation scale per row and 128 columns), NVIDIA's DFlash drafter (7 tokens a
# pass, the block it was trained at) and the bf16 vision tower and audio encoder in pinned host memory.
# bf16 KV. Thinking is off, as in NVIDIA's template; switch it per request (chat_template_kwargs).
# Sampling as NVIDIA states it (temperature 1.0, top_p 0.95) and the checkpoint's top_k 64.
name: radiance-nemotron-3.5-bolt-e4b-i8g
services:
  radiance:
    extends: { file: common.yaml, service: radiance }
    container_name: radiance-nemotron-3.5-bolt-e4b-i8g
    command: >
      --model /models/nemotron-3.5-bolt-e4b-i8g.rad
      --host :: --port ${PORT:-8000} --api-key-env RADIANCE_API_KEY
      --tp 2 --max-num-seqs 8 --max-model-len 65536 --kv-cache-dtype bf16
      --num-speculative-tokens 7 --mm-max-patches 2520 --vision-tower-placement ram
      --temp 1.0 --top-p 0.95 --top-k 64 --chat-template-kwargs '{"enable_thinking":false}'
