# Ornith-1.5-35B-A3B, FP8 with one scale per 128x128 block, its own MTP head and the vision tower.
# Sampling is Ornith's setting for general tasks; for precise coding use --temp 0.6
# --presence-penalty 0. Thinking is on by default and switched per request (chat_template_kwargs).
name: radiance-ornith-1.5-35b-a3b
services:
  radiance:
    extends: { file: common.yaml, service: radiance }
    container_name: radiance-ornith-1.5-35b-a3b
    command: >
      --model /models/ornith-1.5-35b-a3b-fp8.rad
      --host :: --port ${PORT:-8000} --api-key-env RADIANCE_API_KEY
      --tp 2 --max-num-seqs 8 --max-model-len 262144 --kv-cache-dtype fp8
      --num-speculative-tokens 3 --max-num-batched-tokens 2048
      --temp 1.0 --top-p 0.95 --top-k 20 --presence-penalty 1.5
