# Ornith-1.5-35B-A3B with four-bit experts (w4nl64, GPTQ), the trunk block-FP8, an int8 lm_head, its own MTP
# head and the vision tower: 20 GiB, so it also runs on one card (ornith-1.5-35b-a3b-w4a8-tp1.yaml).
# Sampling as ornith-1.5-35b-a3b.yaml.
name: radiance-ornith-1.5-35b-a3b-w4a8
services:
  radiance:
    extends: { file: common.yaml, service: radiance }
    container_name: radiance-ornith-1.5-35b-a3b-w4a8
    command: >
      --model /models/ornith-1.5-35b-a3b-w4a8.rad
      --host :: --port ${PORT:-8000} --api-key-env RADIANCE_API_KEY
      --tp 2 --max-num-seqs 8 --max-model-len 262144 --kv-cache-dtype fp8
      --num-speculative-tokens 3 --max-num-batched-tokens 2048
      --temp 1.0 --top-p 0.95 --top-k 20 --presence-penalty 1.5
