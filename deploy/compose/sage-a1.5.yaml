# Sage-A1.5, InternScience's Qwen3.5-35B-A3B-VL post-train: FP8 with one scale per 128x128
# block, its routed MTP head and the vision tower, as data/recipes/sage-a1.5-fp8.recipe makes
# it. Sampling is the model card's (temp 1.0, top_p 0.95, top_k 20, presence 1.5). Thinking and
# the opt-in verification mode are switched per request (chat_template_kwargs).
#
# The profile below is the measured one: four 32,768-token sessions, the whole expert plane in
# VRAM. A single 262,144-token session instead is `--max-num-seqs 1 --max-model-len 262144`:
# the planner charges ~1.5 GiB of KV a card for it (1.49 GiB backs 262,176 tokens in the tp2
# boot log). Eight of them are ~12 GiB of KV a card, which does not fit beside 15.5 GiB of
# resident experts and 1.9 GiB of static weights once the arena for eight sequences is charged.
name: radiance-sage-a1.5
services:
  radiance:
    extends: { file: common.yaml, service: radiance }
    container_name: radiance-sage-a1.5
    command: >
      --model /models/sage-a1.5-fp8.rad
      --host :: --port ${PORT:-8000} --api-key-env RADIANCE_API_KEY
      --tp 2 --max-num-seqs 4 --max-model-len 32768 --kv-cache-dtype fp8
      --num-speculative-tokens 3 --max-num-batched-tokens 2048
      --temp 1.0 --top-p 0.95 --top-k 20 --presence-penalty 1.5
