# Gemma 4 31B-it: int4 trunk (round-to-nearest with a scale search, from the bf16 checkpoint) with
# int8 activations, z-lab's DFlash drafter merged in (block fp8, 15 tokens a pass), and the vision
# tower. Converted with data/recipes/gemma4-31b-dense-bf16-w4a8-df.recipe. Sampling defaults are the
# checkpoint's generation_config; thinking is switched per request (chat_template_kwargs).
# The drafter serves one depth, the block it was trained at (16, so 15 drafts); `auto` asks the
# container. On four cards use --tp 4. --draft-window adaptive lets each sequence verify only as
# much of the block as its own acceptance pays for, worth it at higher --max-num-seqs.
name: radiance-gemma4-31b-w4a8-df
services:
  radiance:
    extends: { file: common.yaml, service: radiance }
    container_name: radiance-gemma4-31b-w4a8-df
    command: >
      --model /models/gemma4-31b-dense-w4a8-df.rad
      --host :: --port ${PORT:-8000} --api-key-env RADIANCE_API_KEY
      --tp 2 --max-num-seqs 8 --max-model-len 65536 --kv-cache-dtype fp8
      --num-speculative-tokens auto --max-num-batched-tokens 2048 --temp 1.0 --top-p 0.95 --top-k 64
