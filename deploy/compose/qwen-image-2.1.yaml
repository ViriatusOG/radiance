# Qwen-Image 2.1 (Qwen/Qwen-Image-2.1) as block fp8: pictures from a prompt and edits of up to ten
# pictures on OpenAI's /v1/images/generations and /v1/images/edits, 2048x2048 by default. Two
# cards: the conditioning cache holds all ten reference pictures (one card holds four). 2.1-Turbo
# is qwen-image-2.1-turbo.yaml; the bf16 container needs both cards. The engine sizes the step,
# batch and context for an image generator itself (docs/GUIDE.md §5.6). --tp-wire wht6 sends the
# DiT's all-reduces as 6-bit: about 10% faster per picture at a cost of a few tenths of a dB
# against diffusers; drop it for the exact wire.
# LoRA files (Civitai and the like, docs/GUIDE.md §4.9.2): put them under
# $RADIANCE_MODELS/loras/qwen-image and add `--lora-dir /models/loras/qwen-image` to the command;
# a request names them in `loras` or as <lora:name:0.8> in its prompt.
name: radiance-qwen-image
services:
  radiance:
    extends: { file: common.yaml, service: radiance }
    container_name: radiance-qwen-image
    command: >
      --model /models/qwen-image-2.1-fp8.rad
      --host :: --port ${PORT:-8000} --api-key-env RADIANCE_API_KEY
      --tp 2 --tp-wire wht6
