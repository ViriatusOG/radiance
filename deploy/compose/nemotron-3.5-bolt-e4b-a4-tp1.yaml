# NVIDIA-Nemotron-3.5-Bolt-E4B on one card: the container of nemotron-3.5-bolt-e4b-a4.yaml at --tp 1.
# BetterBench combined on a R9700: 302 tok/s here, 346 tok/s on two cards.
name: radiance-nemotron-3.5-bolt-e4b-a4-tp1
services:
  radiance:
    extends: { file: common.yaml, service: radiance }
    container_name: radiance-nemotron-3.5-bolt-e4b-a4-tp1
    command: >
      --model /models/nemotron-3.5-bolt-e4b-a4.rad
      --host :: --port ${PORT:-8000} --api-key-env RADIANCE_API_KEY
      --tp 1 --max-num-seqs 8 --max-model-len 65536 --kv-cache-dtype bf16
      --num-speculative-tokens 7 --mm-max-patches 2520 --vision-tower-placement ram
      --temp 1.0 --top-p 0.95 --top-k 64 --chat-template-kwargs '{"enable_thinking":false}'
