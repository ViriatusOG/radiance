# Qwen3-ASR 1.7B (Qwen/Qwen3-ASR-1.7B-hf) served from its checkpoint as it ships, no conversion:
# speech to text on OpenAI's /v1/audio/transcriptions and live over /v1/realtime, 30 languages.
# The model is small and runs on one card, RADIANCE_GPU in .env (default 0). Each live session holds
# one sequence, so --max-num-seqs is the most sessions served at once.
name: radiance-qwen3-asr
services:
  radiance:
    extends: { file: common.yaml, service: radiance }
    container_name: radiance-qwen3-asr
    environment:
      ROCR_VISIBLE_DEVICES: "${RADIANCE_GPU:-0}"
    command: >
      --model /models/Qwen3-ASR-1.7B-hf
      --host :: --port ${PORT:-8000} --api-key-env RADIANCE_API_KEY
      --tp 1 --max-num-seqs 16
