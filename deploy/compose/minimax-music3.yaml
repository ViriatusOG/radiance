# MiniMax-Music3 (MiniMaxAI/MiniMax-Music3) in bf16: songs from lyrics (`input`) and a description
# (`instructions`) on /v1/audio/speech, 44.1 kHz stereo, whole or streamed as they are made, at about
# the speed they play on two cards.
name: radiance-minimax-music3
services:
  radiance:
    extends: { file: common.yaml, service: radiance }
    container_name: radiance-minimax-music3
    command: >
      --model /models/minimax-music3-bf16.rad
      --host :: --port ${PORT:-8000} --api-key-env RADIANCE_API_KEY
      --tp 2
