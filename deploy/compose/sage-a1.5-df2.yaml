# Sage-A1.5 with incoai's Qwen3.6-35B-A3B DFlash2 drafter in place of the MTP head, made by
# data/recipes/sage-a1.5-fp8-df2.recipe. The drafter proposes seven tokens in one block pass
# (block 8, acceptance ~49% at depth 7); measured 393 tok/s decode on two cards against 282 with
# MTP. Sampling is the model card's (temp 1.0, top_p 0.95, top_k 20, presence 1.5).
#
# The profile below is the measured one: four 32,768-token sessions, the whole expert plane in
# VRAM. A single 262,144-token session instead is `--max-num-seqs 1 --max-model-len 262144`.
name: radiance-sage-a1.5-df2
services:
  radiance:
    extends: { file: common.yaml, service: radiance }
    container_name: radiance-sage-a1.5-df2
    command: >
      --model /models/sage-a1.5-fp8-df2.rad
      --host :: --port ${PORT:-8000} --api-key-env RADIANCE_API_KEY
      --tp 2 --max-num-seqs 4 --max-model-len 32768 --kv-cache-dtype fp8
      --num-speculative-tokens auto --max-num-batched-tokens 2048
      --temp 1.0 --top-p 0.95 --top-k 20 --presence-penalty 1.5
